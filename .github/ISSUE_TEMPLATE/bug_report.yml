name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill in as much detail as possible so it can be reproduced and fixed quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Open the Translate page
        2. Enter text and click Send
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: Which page is affected?
      options:
        - Dashboard (/)
        - Text Translation (/translate)
        - Language Detection (/detect)
        - Localization Files (/localize)
        - Speech to Text (/transcribe)
        - Other / all pages
    validations:
      required: true

  - type: input
    id: grpc_version
    attributes:
      label: Lopatnov.Translate version
      placeholder: "e.g. 2.0.0 or commit SHA"

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Chrome 124, Firefox 125, Safari 17"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste browser console errors or attach screenshots (plain text — no code rendering forced).
