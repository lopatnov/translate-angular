<main class="app-shell container-fluid px-0">
  <style>
    #scroll-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 3rem;
      height: 3rem;
      background: #c9a24a;
      color: #070603;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(201, 162, 74, 0.3);
      font-weight: bold;
    }
    #scroll-to-top.show { display: flex; opacity: 1; }
    #scroll-to-top:hover {
      background: #d4b358;
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(201, 162, 74, 0.4);
    }
    @media (max-width: 991px) {
      #scroll-to-top { bottom: 1rem; right: 1rem; }
    }
  </style>

  <div class="row gx-0">
    <!-- Sidebar -->
    <aside class="sidebar col-auto d-flex flex-column p-4 text-white">
      <div class="sidebar-brand mb-4">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="badge rounded-pill bg-warning text-dark">Live</span>
          <h1 class="mb-0 fs-5 fw-semibold">Translate Studio</h1>
        </div>
        <p class="text-muted small mb-0">gRPC service testing interface</p>
      </div>

      <nav class="nav nav-pills flex-column gap-1 mb-4" aria-label="Main navigation">
        <a class="nav-link"
           routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           aria-label="Dashboard">
          <span aria-hidden="true">⊞</span> Dashboard
        </a>
        <a class="nav-link"
           routerLink="/translate"
           routerLinkActive="active"
           aria-label="Text translation">
          <span aria-hidden="true">⇄</span> Text translation
        </a>
        <a class="nav-link"
           routerLink="/detect"
           routerLinkActive="active"
           aria-label="Language detection">
          <span aria-hidden="true">◎</span> Language detection
        </a>
        <a class="nav-link"
           routerLink="/localize"
           routerLinkActive="active"
           aria-label="Localization files">
          <span aria-hidden="true">⊞</span> Localization files
        </a>
        <a class="nav-link"
           routerLink="/transcribe"
           routerLinkActive="active"
           aria-label="Speech to text">
          <span aria-hidden="true">🎙</span> Speech to text
        </a>
      </nav>

      <div class="mt-auto pt-3 border-top border-white-10">
        <div class="small text-muted">gRPC: localhost:5100</div>
      </div>
    </aside>

    <!-- Main content -->
    <section class="main-content col">
      <div class="container-fluid py-4">
        <router-outlet />
      </div>
    </section>
  </div>

  <button type="button" id="scroll-to-top" aria-label="Scroll to top">↑</button>
</main>
