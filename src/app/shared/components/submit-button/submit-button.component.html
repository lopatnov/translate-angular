<button type="submit" class="btn btn-primary"
        [disabled]="disabled() || loading()">
  @if (loading()) {
    <span class="spinner-border spinner-border-sm me-2"
          role="status" aria-hidden="true"></span>
    {{ loadingLabel() || label() + '…' }}
  } @else {
    {{ label() }}
  }
</button>
